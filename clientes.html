<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - EmanusFix</title>
  <link rel="stylesheet" href="clientes.css">
</head>
<body>
  <!--Menu Lateral-->
    <aside class="sidebar">
        <div class="logo">
            <h2>Sistema Fix</h2>
        </div>

        <nav class="menu">
            <ul>
                <li>
                    <a href="index.html">
                        <img src="/Imagens/house.png" alt="Início"> 
                        Início
                    </a>
                </li>
                <li>
                    <a href="aparelhos.html">
                        <img src="/Imagens/phone.png" alt="Aparelhos"> 
                        Aparelhos
                    </a>
                </li>
                <li>
                    <a href="clientes.html" class="active">
                        <img src="/Imagens/contact.png" alt="Clientes"> 
                        Clientes
                    </a>
                </li>
                <li>
                    <a href="configuração.html">
                        <img src="/Imagens/settings.png" alt="Configurações"> 
                        Configurações
                    </a>
                </li>
                <li>
                    <a href="ordens.html">
                        <img src="/Imagens/scroll-text.png" alt="Ordem"> 
                        Ordem
                    </a>
                </li>
                <li>
                    <a href="estoque.html">
                        <img src="/Imagens/boxes.png" alt="Boxes"> 
                        Estoque
                    </a>
                </li>
                <li>
                    <a href="financeiro.html">
                        <img src="/Imagens/badge-dollar-sign.png" alt="Financeiro"> 
                        Financeiro
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

  <!-- Conteúdo principal -->
  <main class="content">
    <header>
      <h1>Gerenciamento de Clientes</h1>
      <button id="novoClienteBtn" class="btn">+ Novo Cliente</button>
    </header>

    <!-- Barra de pesquisa -->
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Pesquisar cliente...">
    </div>

    <!-- Lista de clientes -->
    <table id="clientesTable">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Telefone</th>
          <th>E-mail</th>
          <th>CPF/CNPJ</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <!-- Clientes serão inseridos dinamicamente via JS -->
      </tbody>
    </table>
  </main>

  <!-- Modal de novo cliente -->
  <div id="clienteModal" class="modal">
    <div class="modal-content">
      <h2>Novo Cliente</h2>
      <form id="clienteForm">
        <label>Nome completo</label>
        <input type="text" id="nome" required>

        <label>Telefone</label>
        <input type="tel" id="telefone" required>

        <label>E-mail</label>
        <input type="email" id="email">

        <label>CPF/CNPJ</label>
        <input type="text" id="documento">

        <label>Observações</label>
        <textarea id="observacoes"></textarea>

        <div class="buttons">
          <button type="submit" class="btn salvar">Salvar</button>
          <button type="button" id="cancelarBtn" class="btn cancelar">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="clientes.js"></script>
</body>
</html>
