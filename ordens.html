  <!----------- ORDEM DE SERVIÇO ----------->
    <main class="content">
        <header>
            <h1>Ordens de Serviço</h1>
        </header>

        <!-- Barra de pesquisa -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Pesquisar aparelho...">
        </div>
    </main>
    <section id="ordem-servico" class="hidden p-6">
        
            <!-- Formulário de cadastro de OS -->
        <form id="os-form" class="bg-white p-4 rounded-2xl shadow-md">
            <!-- Linha 1: Cliente + Telefone + Email + Aparelho -->
            <div class="form-row">
                <div class="form-group">
                    <label for="os-cliente">Cliente <span class="required">*</span></label>
                    <input type="text" id="os-cliente" name="os-cliente" placeholder="Nome do cliente" required>
                </div>
                <div class="form-group">
                    <label for="os-telefone">Telefone</label>
                    <input type="text" id="os-telefone" name="os-telefone" placeholder="Telefone">
                </div>
                <div class="form-group">
                    <label for="os-email">Email</label>
                    <input type="email" id="os-email" name="os-email" placeholder="Email">
                </div>
                <div class="form-group">
                    <label for="os-aparelho">Aparelho <span class="required">*</span></label>
                    <input type="text" id="os-aparelho" name="os-aparelho" placeholder="Ex: Celular, Notebook" required>
                </div>
            </div>

            <!-- Linha 2: Marca + Diagnóstico + Solução + Valor + Prioridade -->
            <div class="form-row">
                <div class="form-group">
                    <label for="os-marca">Marca <span class="required">*</span></label>
                    <input type="text" id="os-marca" name="os-marca" placeholder="Marca" required>
                </div>
                <div class="form-group">
                    <label for="os-diagnostico">Diagnóstico</label>
                    <input type="text" id="os-diagnostico" name="os-diagnostico" placeholder="Diagnóstico">
                </div>
                <div class="form-group">
                    <label for="os-solucao">Solução</label>
                    <input type="text" id="os-solucao" name="os-solucao" placeholder="Solução">
                </div>
                <div class="form-group">
                    <label for="os-valor">Valor (R$)</label>
                    <input type="number" id="os-valor" name="os-valor" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label for="os-prioridade">Prioridade</label>
                    <select id="os-prioridade" name="os-prioridade">
                        <option>Baixa</option>
                        <option>Média</option>
                        <option>Alta</option>
                    </select>
                </div>
            </div>

            <!-- Linha 3: CEP + Rua + Número + Bairro -->
            <div class="form-row">
                <div class="form-group">
                    <label for="os-cep">CEP <span class="required">*</span></label>
                    <input type="text" id="os-cep" name="os-cep" placeholder="CEP" required>
                </div>
                <div class="form-group" style="flex: 2;">
                    <label for="os-rua">Rua</label>
                    <input type="text" id="os-rua" name="os-rua" placeholder="Nome da rua">
                </div>
                <div class="form-group">
                    <label for="os-numero">Número</label>
                    <input type="text" id="os-numero" name="os-numero" placeholder="Nº">
                </div>
                <div class="form-group">
                    <label for="os-bairro">Bairro</label>
                    <input type="text" id="os-bairro" name="os-bairro" placeholder="Bairro">
                </div>
            </div>

            <!-- Linha 4: Referência + Cidade + Estado -->
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label for="os-referencia">Referência</label>
                    <input type="text" id="os-referencia" name="os-referencia" placeholder="Referência">
                </div>
                <div class="form-group" style="flex: 2;">
                    <label for="os-cidade">Cidade</label>
                    <input type="text" id="os-cidade" name="os-cidade" placeholder="Cidade">
                </div>
                <div class="form-group">
                    <label for="os-estado">Estado</label>
                    <input type="text" id="os-estado" name="os-estado" placeholder="UF">
                </div>
            </div>

            <!-- Linha 5: Data Entrada + Data Saída + Observações -->
            <div class="form-row">
                <div class="form-group">
                    <label for="os-data-entrada">Data de Entrada</label>
                    <input type="date" id="os-data-entrada" name="os-data-entrada">
                </div>
                <div class="form-group">
                    <label for="os-data-saida">Data de Saída Estimada</label>
                    <input type="date" id="os-data-saida" name="os-data-saida">
                </div>
                <div class="form-group" style="flex: 2;">
                    <label for="os-observacoes">Observações</label>
                    <input type="text" id="os-observacoes" name="os-observacoes" placeholder="Observações">
                </div>
            </div>

            <!-- Linha 6: Status + Colaborador -->
            <div class="form-row">
                <div class="form-group">
                    <label for="os-status">Status</label>
                    <select id="os-status" name="os-status">
                        <option>Pendente</option>
                        <option>Em andamento</option>
                        <option>Concluído</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="os-colaborador">Colaborador</label>
                    <input type="text" id="os-colaborador" name="os-colaborador" placeholder="Nome do colaborador">
                </div>
            </div>

            <button type="submit" class="btn-submit">Salvar OS</button>
        </form>

        <!-- Lista de Ordens de Serviço -->
        <div id="os-lista" class="mt-6">
            <table>
                <thead>
                    <tr>
                        <th style="width:80px">Número do Serviço</th>
                        <th style="width:80px">Cliente</th>
                        <th style="width:100px">Status</th>
                        <th style="width:140px">Data de Entrada</th>
                        <th style="width:80px">Detalhes</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </section>
