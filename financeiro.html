  <!-- ==================== FINANCEIRO ==================== -->
  <section id="financeiro" class="hidden p-6">
    <h2 class="text-2xl font-semibold mb-4">Controle Financeiro</h2>

    <!-- Formulário de lançamento -->
    <form id="financeiro-form" class="bg-white p-4 rounded-2xl shadow-md max-w-3xl">
      <div class="grid grid-cols-3 gap-4">

        <div>
          <label for="tipo" class="block text-sm font-medium mb-1">Tipo</label>
          <select id="tipo" name="tipo" class="w-full border rounded-md p-2">
            <option>Entrada</option>
            <option>Saída</option>
          </select>
        </div>

        <div>
          <label for="descricao" class="block text-sm font-medium mb-1">Descrição</label>
          <input type="text" id="descricao" name="descricao" placeholder="Ex: Reparo, compra de peça..." class="w-full border rounded-md p-2">
        </div>

        <div>
          <label for="valor" class="block text-sm font-medium mb-1">Valor (R$)</label>
          <input type="number" id="valor" name="valor" placeholder="0.00" class="w-full border rounded-md p-2">
        </div>

        <div>
          <label for="metodo" class="block text-sm font-medium mb-1">Método de Pagamento</label>
          <select id="metodo" name="metodo" class="w-full border rounded-md p-2">
            <option>Pix</option>
            <option>Cartão</option>
            <option>Dinheiro</option>
            <option>Parcelado</option>
          </select>
        </div>

        <div>
          <label for="data" class="block text-sm font-medium mb-1">Data</label>
          <input type="date" id="data" name="data" class="w-full border rounded-md p-2">
        </div>

        <div>
          <label for="categoria" class="block text-sm font-medium mb-1">Categoria</label>
          <input type="text" id="categoria" name="categoria" placeholder="Ex: manutenção, compra..." class="w-full border rounded-md p-2">
        </div>

      </div>

      <button type="submit" class="mt-4 bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition">
        Adicionar Lançamento
      </button>
    </form>

    <!-- Resumo financeiro -->
    <div class="mt-8 grid grid-cols-3 gap-6 text-center">
      <div class="bg-green-50 p-4 rounded-xl shadow">
        <h3 class="text-green-700 font-semibold text-lg">Entradas</h3>
        <p id="total-entradas" class="text-2xl font-bold mt-2">R$ 0,00</p>
      </div>

      <div class="bg-red-50 p-4 rounded-xl shadow">
        <h3 class="text-red-700 font-semibold text-lg">Saídas</h3>
        <p id="total-saidas" class="text-2xl font-bold mt-2">R$ 0,00</p>
      </div>

      <div class="bg-blue-50 p-4 rounded-xl shadow">
        <h3 class="text-blue-700 font-semibold text-lg">Saldo</h3>
        <p id="saldo-geral" class="text-2xl font-bold mt-2">R$ 0,00</p>
      </div>
    </div>

    <!-- Lista de lançamentos -->
    <div id="lista-financeira" class="mt-8 space-y-4">
      <!-- Lançamentos serão listados aqui -->
    </div>
  </section>
