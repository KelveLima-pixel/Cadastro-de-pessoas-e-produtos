<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>
            <img src="./logo emanus.png" alt="logo">
        </h1>
    </header>
    
    <main> 
        <!-- Formulário de Cadastro -->
        <section> 
            <h2> <i>Cadastrar Pessoa e Produto</i> </h2>
            <form id="cadastroForm"> 
                <label for="nomeCliente">Nome do Cliente:</label>
                <input type="text" id="nomeCliente" placeholder="Digite o nome do cliente" required> 
                
                <label for="contatoCliente">Contato:</label> 
                <input type="text" id="contatoCliente" placeholder="Digite o contato do cliente" required> 
                
                <label for="enderecoCliente">Endereço:</label> 
                <input type="text" id="enderecoCliente" placeholder="Cep, bairro, rua, número" required> 
                
                <label for="marcaProduto">Marca do Produto:</label> 
                <input type="text" id="marcaProduto" placeholder="Digite a marca do produto" required> 
                
                <label for="serieProduto">Série do Produto:</label> 
                <input type="text" id="serieProduto" placeholder="Digite a série do produto" required> 

                <label for="valordoserviço">Valor do Serviço:</label> 
                <input type="text" id="valordoserviço" placeholder="Digite o valor do serviço" required> 
                
                <button type="submit">Cadastrar</button> 
            </form> 
        </section> 

        <!-- Lista de Pessoas e Produtos --> 
        <section> 
            <h2>Lista de Pessoas e Produtos Cadastrados</h2> 
            <ul id="listaCadastro"></ul> 
        </section> 
    </main> 


    <!-- Complemento -->
        <!-- Menu de abas -->
    <nav class="tabs">
        <button class="tab-btn active" onclick="abrirAba('gestao')">Gestão Financeira</button>
        <button class="tab-btn" onclick="abrirAba('historico')">Histórico Financeiro</button>
    </nav>

    <!-- Aba Gestão Financeira -->
    <section id="gestao" class="tab-content active">
        <h2>Gestão Financeira</h2>
        <form id="financeForm">
            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" placeholder="Ex: Venda, Compra, Serviço" required>

            <label for="tipo">Tipo:</label>
            <select id="tipo" required>
                <option value="receita">Receita</option>
                <option value="despesa">Despesa</option>
            </select>

            <label for="valor">Valor (R$):</label>
            <input type="number" id="valor" placeholder="Digite o valor" required>

            <label for="imposto">Imposto (%):</label>
            <input type="number" id="imposto" placeholder="Ex: 10" value="10" required>

            <button type="submit">Adicionar</button>
        </form>

        <h3>Transações</h3>
        <table id="tabelaFinanceira">
            <thead>
                <tr>
                    <th>Descrição</th>
                    <th>Tipo</th>
                    <th>Valor Bruto</th>
                    <th>Imposto</th>
                    <th>Valor Líquido</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <h3 id="saldo">Saldo: R$ 0,00</h3>
    </section>

    <!-- Aba Histórico -->
    <section id="historico" class="tab-content">
        <h2>Histórico Financeiro</h2>
        <table id="tabelaHistorico">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Descrição</th>
                    <th>Tipo</th>
                    <th>Valor Bruto</th>
                    <th>Imposto</th>
                    <th>Valor Líquido</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>


  
    
    <script src="script.js"></script> 
</body>

</html>
